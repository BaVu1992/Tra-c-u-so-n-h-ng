<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard nhập hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202b; --ink2:#5a6875; --line:#d8dee4; --line2:#e7ebef;
  --accent:#0b5cad; --accent-ink:#ffffff; --accent-soft:#dbe9f8;
  --warn:#a45a00; --warn-soft:#fbecd3; --bad:#b3261e; --bad-soft:#fbe3e1; --ok:#1c7a3d; --ok-soft:#ddf1e3;
  --bar:#0b5cad; --bar-ink:#ffffff; --track:#e3e8ed; --c-done:#2a78d6; --grid:#e3e8ed;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#18222b; --ink:#e8edf1; --ink2:#93a1ae; --line:#2b3947; --line2:#223040;
  --accent:#6cb0f5; --accent-ink:#06182e; --accent-soft:#12283f;
  --warn:#f0b35a; --warn-soft:#3a2b10; --bad:#ff8b82; --bad-soft:#3d1a18; --ok:#6fd08b; --ok-soft:#14301c;
  --bar:#0a3f7c; --bar-ink:#ffffff; --track:#26343f; --c-done:#3987e5; --grid:#26343f;}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#18222b; --ink:#e8edf1; --ink2:#93a1ae; --line:#2b3947; --line2:#223040;
  --accent:#6cb0f5; --accent-ink:#06182e; --accent-soft:#12283f;
  --warn:#f0b35a; --warn-soft:#3a2b10; --bad:#ff8b82; --bad-soft:#3d1a18; --ok:#6fd08b; --ok-soft:#14301c;
  --bar:#0a3f7c; --bar-ink:#ffffff; --track:#26343f; --c-done:#3987e5; --grid:#26343f;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif;margin:0;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:960px;margin:0 auto}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);margin-inline:-16px;padding:10px 16px}
header.top .in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.72}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:var(--bar-ink);opacity:.72;padding:8px 12px;border-radius:8px;font-weight:600}
nav button[aria-current="page"]{background:rgba(255,255,255,.14);opacity:1}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:15px;margin:22px 0 8px}
.muted{color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.search{display:block;width:100%;padding:14px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:16px 0 10px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--line2)}
.row .t{font-weight:600;overflow-wrap:anywhere}.row .s{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.row .r{text-align:right;font-size:13px;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--line2);color:var(--ink2);display:inline-block}
.pill.done{background:var(--ok-soft);color:var(--ok)}.pill.part{background:var(--warn-soft);color:var(--warn)}.pill.todo{background:var(--bad-soft);color:var(--bad)}
.loc{display:inline-block;font-size:12px;font-weight:700;background:var(--bar);color:var(--bar-ink);border-radius:5px;padding:1px 7px;font-family:"JetBrains Mono",monospace;white-space:nowrap}
.back{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{padding:12px 14px}.stat b{font-size:22px;display:block;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--ink2)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
table.fit{min-width:0}
table.fit th,table.fit td{padding:8px 8px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
td.n,th.n{text-align:right}
.bars{padding:6px 16px 12px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tk{height:12px;background:var(--track);border-radius:3px;overflow:hidden;display:flex}
.bar .tk i{display:block;height:100%}.bar .g{background:var(--accent)}
.bar .v{font-size:12.5px;color:var(--ink2);min-width:84px;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.drop.ic{padding:12px 14px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--ic);background:color-mix(in srgb,var(--ic) 9%,var(--surface));border-radius:10px}
.drop.ic b{display:block;font-size:14px;color:var(--ic)}.drop.ic .muted{font-size:12.5px;margin-top:3px;word-break:break-word}
.drop.ic:hover,.drop.ic.on{border-color:var(--ic);background:color-mix(in srgb,var(--ic) 16%,var(--surface))}
.ic1{--ic:#0b5cad}.ic2{--ic:#0e8f7e}.ic3{--ic:#c56a12}.ic4{--ic:#7a4fc4}.ic5{--ic:#2e9e5b}
.drop{display:block;padding:24px 18px;text-align:center;border:2px dashed var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:13.5px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:12px 0}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:34px 20px;text-align:center}
.prog{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--accent)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.tools select{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:240px;max-width:100%}
.tools label{display:flex;gap:6px;align-items:center;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;padding:14px 16px}
.kv div{font-size:13.5px}.kv span{display:block;font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.zone{font-size:12px;color:var(--ink2)}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr auto}.bar .v{min-width:0}}

.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:6px;max-width:260px;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.kpi{padding:14px 16px}.kpi .l{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.mbar{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px;display:flex;gap:2px}.mbar i{display:block;background:var(--c-done)}
.card{padding:16px 16px 12px;margin-bottom:12px}.card h3{margin:0 0 2px}.card .sub{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lnk{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:600;padding:2px 0}
.hb{display:grid;grid-template-columns:minmax(80px,170px) 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:13.5px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tk{display:flex;gap:2px;height:14px;background:transparent}
.hb .tk i{display:block;height:100%}.hb .d{background:var(--c-done);border-radius:0 0 0 0}.hb .r{background:var(--track)}
.hb .tk i:first-child{border-radius:4px 0 0 4px}.hb .tk i:last-child{border-radius:0 4px 4px 0}.hb .tk i:only-child{border-radius:4px}
.hb .v{font-size:12.5px;color:var(--ink2);text-align:right;white-space:nowrap}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:0 0 8px}.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c-done)}.leg span.r:before{background:var(--track)}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--ink2);font-size:11px;font-family:inherit}
svg.ch .g{stroke:var(--grid);stroke-width:1}
svg.ch rect.b{fill:var(--c-done)}svg.ch rect.b:hover{opacity:.8}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
.mini{display:inline-block;width:70px;height:6px;background:var(--track);border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:6px}.mini i{display:block;height:100%;background:var(--c-done)}
.scroll{max-height:460px;overflow:auto}
.scroll th{position:sticky;top:0;background:var(--surface);z-index:1}

.kvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 6px}
.kvs .tk{background:var(--accent-soft)}.kvs .tk b{color:var(--accent)}
.kvs div{background:var(--bg);border-radius:8px;padding:8px 10px}.kvs b{display:block;font-size:18px}.kvs span{font-size:12px;color:var(--ink2)}
.hot{color:var(--warn)}
.pcard{padding:14px 16px;margin-bottom:12px}
.pcard .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;align-items:center}
.pl+.pl{border-top:1px dashed var(--line2)}
.pl .sm{font-size:12px;color:var(--ink2);overflow-wrap:anywhere;grid-column:1/-1}
.pl .q{font-weight:700;text-align:right;white-space:nowrap}
.sec{border:1px solid color-mix(in srgb,var(--sc) 30%,var(--line2));border-left:5px solid var(--sc);background:color-mix(in srgb,var(--sc) 7%,var(--surface));border-radius:10px;padding:10px 12px;margin-top:12px}
.sec h4{color:var(--sc)}.sec .loc{background:var(--sc);color:#fff}
.sc1{--sc:#0b5cad}.sc2{--sc:#0e8f7e}.sc3{--sc:#7a4fc4}.sc4{--sc:#c56a12}
.kvs .k1{background:color-mix(in srgb,#0b5cad 14%,var(--surface))}.kvs .k1 b{color:#0b5cad}
.kvs .k2{background:color-mix(in srgb,#2e9e5b 15%,var(--surface))}.kvs .k2 b{color:#2e9e5b}
.kvs .k3{background:color-mix(in srgb,#d9822b 16%,var(--surface))}.kvs .k3 b{color:#c56a12}
.kvs .tk{background:color-mix(in srgb,#7a4fc4 14%,var(--surface))}.kvs .tk b{color:#7a4fc4}
.pcard .nm{color:var(--accent)}
.vqbars{display:flex;align-items:flex-end;gap:2px;height:84px;margin:8px 0 4px}.vqbars i{flex:1;background:#0b5cad;border-radius:2px 2px 0 0;min-height:2px}.vqbars i.z{background:var(--line);min-height:2px}
.vqax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2)}
.sc5{--sc:#d0407f}.kvs .k4{background:color-mix(in srgb,#d0407f 13%,var(--surface))}.kvs .k4 b{color:#d0407f}
.rk{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;align-items:center;justify-content:center;margin-right:8px}
.ic6{--ic:#d0407f}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;white-space:nowrap}
.tag.t1{background:var(--warn-soft);color:var(--warn)}
</style>
</head><body>
<header class="top"><div class="in">
  <div class="brand"><span id="bt">Dashboard nhập hàng</span><small id="ver">Chưa có dữ liệu</small></div>
  <nav id="nav"></nav>
</div></header>
<div class="tip" id="tip" hidden></div>
<main class="wrap" id="app"><p class="muted" style="padding:24px 0">Đang tải dữ liệu…</p></main>

<script id="embedded">window.__STAFF=true;window.__DATA="H4sIAMrArmoC/6tWSslPLlayUoiO1VFQqsrPS4VzclNLEoHsvNKcHCCvKDE5GyZTkJiTWgLjlOTnwZhlhQj1uUFI7AAkdggSOwzKrgUAKR3laocAAAA="</script>
<script>
const SRC="<!doctype html>\n"+document.documentElement.outerHTML;
(function(){
"use strict";
const $=s=>document.querySelector(s), app=$("#app"), navEl=$("#nav");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number.isFinite(n)?(Math.round(n*100)/100).toLocaleString("vi-VN"):"–";
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/\s+/g," ").trim();
const strip=s=>String(s??"").trim().replace(/^'+/,"");
const S={db:null,canEdit:false,tab:"sp",loaded:false,err:"",D:null,zones:new Map(),ver:null,newVer:false,meta:null,
  q:{sp:"",phieu:"",vq:""},view:null,hist:[],dayKey:"",onlyOpen:true,imp:{},msg:"",sort:{},hourTable:false,_dash:null,rack:[],palet:[],ton:[],vq:null,mR:null,mP:null,mT:null,mV:null,prods:[]};

/* ================= data model ================= */
function emptyD(){return {sp:[],shop:[],nhom:[],nv:[],kho:[],loai:[],phieu:[]};}
function derive(D){
  D.spRows=D.sp.map(()=>[]); D.byNo=new Map();
  for(const p of D.phieu){ D.byNo.set(p.so,p);
    p.yc=0;p.da=0; for(const r of p.rows){ D.spRows[r[0]].push({p,r}); p.yc+=r[3]; p.da+=r[4]; } }
  D.spIdx=D.sp.map((s,i)=>({i,k:norm(s[0]+" "+s[1])}));
  D.phIdx=D.phieu.map(p=>({p,k:norm([p.so,D.shop[p.shop][0],D.shop[p.shop][1],D.nhom[p.nhom],D.nv[p.nv]?D.nv[p.nv][0]+" "+D.nv[p.nv][1]:"",D.loai[p.loai]].join(" "))}));
  return D;
}
function assemble(docs){ // docs: [[id,data]]
  const m=new Map(docs); const dict=m.get("dict")||{};
  const D=emptyD(); Object.assign(D,{shop:dict.shop||[],nhom:dict.nhom||[],nv:dict.nv||[],kho:dict.kho||[],loai:dict.loai||[]});
  const spIds=[...m.keys()].filter(k=>k.startsWith("sp")).sort(); for(const k of spIds) D.sp.push(...m.get(k).s);
  const cIds=[...m.keys()].filter(k=>k.startsWith("c")).sort();
  for(const k of cIds) for(const p of m.get(k).p) D.phieu.push({so:p[0],loai:p[1],ngay:p[2],shop:p[3],nhom:p[4],nv:p[5],rows:p[6]});
  return derive(D);
}
/* ---- location helpers ---- */
const PAT=/^R(\d+)(?:_D(\d+))?(?:_C(\d+))?(?:_T(\d+))?(?:_H(\d+))?$/;
function locParts(suf){const m=PAT.exec(suf||"");return m?{R:m[1],D:m[2],C:m[3],T:m[4],H:m[5]}:null;}
function locText(suf){const p=locParts(suf); if(!suf) return "Chưa có vị trí"; if(!p) return suf;
  return [p.D?"D"+p.D:"R"+p.R,p.C&&"C"+p.C,p.T&&"T"+p.T,p.H&&"H"+p.H].filter(Boolean).join(" · ");}
function locKey(suf){const p=locParts(suf); if(!p) return suf?"9~"+suf:"~"; const z=n=>String(n||0).padStart(3,"0"); return z(p.R)+z(p.D)+z(p.C)+z(p.T)+z(p.H);}
function zoneOf(khoCode,suf){const p=locParts(suf); if(!p) return null; const b=khoCode+"_Z9_R"+p.R;
  return (p.D&&S.zones.get(b+"_D"+p.D))||S.zones.get(b)||null;}
function zoneText(khoCode,suf){const z=zoneOf(khoCode,suf); return z?`${z[1]} · ${z[2]}`:"";}
const status=(yc,da)=>da>=yc?"done":da>0?"part":"todo";
const STN={done:"Đã soạn",part:"Soạn một phần",todo:"Chưa soạn"};

/* ================= render ================= */
function renderNav(){
  $("#bt").textContent=S.staff?"Tra Cứu Soạn Hàng":"Dashboard nhập hàng";
  let tabs=[["sp","Tra cứu sản phẩm"],["vq","Vòng quay"]]; if(S.canEdit) tabs=[["import","Nhập dữ liệu"],["dash","Dashboard"],...tabs];
  navEl.style.display=tabs.length>1?"":"none"; navEl.innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${n}</button>`).join("");
  $("#ver").textContent=(!S.meta&&(S.mR||S.mP))?"Dữ liệu vị trí kệ / tiền soạn":S.meta?`Dữ liệu ${S.meta.file||""} · nhập ${new Date(S.meta.at).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`:"Chưa có dữ liệu";
}
function render(){
  renderNav();
  if(S.err) return app.innerHTML=`<div class="note">${esc(S.err)}</div>`;
  if(!S.loaded) return;
  let h=S.newVer?`<div class="note">Quản lý vừa cập nhật dữ liệu mới. <button class="btn" data-reload style="padding:6px 12px;margin-left:8px">Tải lại</button></div>`:"";
  if(S.tab==="import") { app.innerHTML=h+importHTML(); return; }
  if(S.tab==="dash") { app.innerHTML=h+dashHTML(); return; }
  const hasRep=!!(S.D&&S.D.phieu.length), hasAny=hasRep||S.rack.length>0||S.palet.length>0||S.ton.length>0;
  const emptyMsg=`<div class="panel empty" style="margin-top:20px"><b>Chưa có dữ liệu</b><p class="muted">${S.canEdit?"Vào tab “Nhập dữ liệu” để nhập các file.":"File này chưa có dữ liệu. Hãy xin quản lý file mới."}</p></div>`;
  if(S.tab==="vq"){ if(!S.vq||!S.vq.rows.length){app.innerHTML=h+`<div class="panel empty" style="margin-top:20px"><b>Chưa có dữ liệu vòng quay</b><p class="muted">${S.canEdit?"Vào tab “Nhập dữ liệu” và nhập file Tổng hợp số lượng soạn.":"Chưa có dữ liệu vòng quay."}</p></div>`;return;}
    app.innerHTML=h+`<input class="search" id="q" type="search" placeholder="Nhập tên hoặc mã sản phẩm để xem vòng quay…" value="${esc(S.q.vq)}" autocomplete="off"><div id="res"></div>`; vqResults(); return; }
  if(S.tab==="sp"&&!S.view){ if(!hasAny){app.innerHTML=h+emptyMsg;return;}
    app.innerHTML=h+`<input class="search" id="q" type="search" placeholder="Nhập tên hoặc mã sản phẩm…" value="${esc(S.q.sp)}" autocomplete="off"><div id="res"></div>`; lookupResults(); return; }
  if(!hasRep){ app.innerHTML=h+emptyMsg; return; }

async function handleVQ(file){

    const out=[];

      const daily=dcols.map(ix=>Number(r[ix])||0); const total=Number(r[it])||daily.reduce((a,b)=>a+b,0);

async function handleTon(file){
  const I=S.imp; I.t=I.t||{}; I.t.ton={m:"Đang đọc…",ok:false}; render();
  try{
    let rows;
    if(/\.csv$|\.txt$/i.test(file.name)){ const tx=await file.text(); rows=Papa.parse(tx,{skipEmptyLines:true}).data; }
    else { const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}); }
    const isCode=h=>["ma sp","ma san pham","ma hang","ma hang hoa","ma sku","sku","ma"].includes(h);
    const qtyRank=h=>/^(so luong )?ton( kho| cuoi| hien tai| ket thuc)?$|^sl ton|^ton /.test(h)?0:/ton/.test(h)?1:/^so luong/.test(h)||/^sl$/.test(h)?2:9;
    let hr=-1,ci=-1,ni=-1,qi=-1;
    for(let r=0;r<Math.min(rows.length,15)&&hr<0;r++){ const hd=(rows[r]||[]).map(x=>norm(x)); const c=hd.findIndex(isCode); if(c<0) continue;
      let best=-1,br=9; hd.forEach((h,ix)=>{const q=qtyRank(h); if(q<br){br=q;best=ix;}}); if(best<0||br>=9) continue;
      hr=r;ci=c;qi=best;ni=hd.findIndex(h=>h==="ten sp"||h==="ten san pham"||h==="ten hang"||h==="ten hang hoa"||h==="ten"); }
    if(hr<0){ const hd=(rows[0]||[]).map(x=>String(x)).join(" | "); throw new Error("Không nhận ra cột Mã sản phẩm và Tồn kho. Các cột đang có: "+hd); }
    const m=new Map();
    for(const r of rows.slice(hr+1)){ let c=strip(r[ci]); if(!c) continue; if(/^\d+$/.test(c)&&c.length<8) c=c.padStart(8,"0");
      const rv=r[qi]; const q=typeof rv==="number"?rv:(parseFloat(String(rv??"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."))||0); const o=m.get(c); if(o) o[2]+=q; else m.set(c,[c,ni>=0?String(r[ni]??"").trim():"",q]); }
    const out=[...m.values()]; if(!out.length) throw new Error("File không có dòng dữ liệu.");
    S._tonMap=null; S.ton=out; S.mT={file:file.name,at:Date.now(),n:out.length}; buildProds(); await persist();
    I.t.ton={m:`Đã lưu tồn kho ${out.length.toLocaleString("vi-VN")} mã sản phẩm.`,ok:true};
  }catch(e){ I.t.ton={m:"Lỗi: "+(e&&e.message||e),ok:false}; }
  render();
}
async function handleTable(kind,file){
  const I=S.imp; I.t=I.t||{}; I.t[kind]={m:"Đang đọc…",ok:false}; render();

    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    const hd=(rows[0]||[]).map(x=>norm(x)), ix=n=>hd.indexOf(n);

    const miss=need.filter(n=>ix(n)<0); if(miss.length) throw new Error("Thiếu cột: "+miss.join(", ")+". Đây có đúng file Data "+(kind==="rack"?"Rack":"Palet")+" không?");
    const g=(r,n)=>String(r[ix(n)]??"").trim(), out=[];
    for(const r of rows.slice(1)){ let c=strip(g(r,"ma sp")); if(!c) continue; if(/^\d+$/.test(c)&&c.length<8) c=c.padStart(8,"0");
      if(kind==="rack") out.push([c,g(r,"ten sp"),g(r,"lau"),num1(g(r,"day")),num1(g(r,"ke")),num1(g(r,"tang")),num1(g(r,"hoc")),parseFloat(g(r,"so luong"))||0,g(r,"quy cach ncc"),g(r,"ghi chu")]);

}

function computeDash(D){

  const g=(m,k)=>{let o=m.get(k);if(!o){o=G();m.set(k,o);}return o;};
  for(const p of D.phieu){ const pd=p.rows.length&&p.rows.every(r=>r[4]>=r[3]); if(pd)T.phDone++; if(p.nv<0)T.noNv++;
    const gl=g(loai,D.loai[p.loai]),gn=g(nhom,D.nhom[p.nhom]),gv=g(nv,p.nv<0?"Chưa phân công":D.nv[p.nv][1]);

      for(const o of [gl,gn,gv]){o.n++;o.yc+=r[3];o.da+=r[4]; if(done)o.dd++;}

      const lp=locParts(r[2]); const kk=D.kho[r[1]][0]+"|R"+(lp?lp.R+(lp.D?"_D"+lp.D:""):"?"); const gd=g(day,kk); gd.n++;gd.yc+=r[3];gd.da+=r[4]; if(done)gd.dd++; gd.ps.add(p.so);
      const z=lp?zoneOf(D.kho[r[1]][0],r[2]):null; const gk=g(kc,z?z[1]:"Chưa rõ khu"); gk.n++;gk.yc+=r[3];gk.da+=r[4]; if(done)gk.dd++; gk.ps.add(p.so);

  <div><label class="drop ic ic3" id="drop4"><input type="file" id="f4" accept=".xlsx,.xls" hidden><b>3. Data Palet · tiền soạn (.xlsx)</b><div class="muted">${S.mP?esc(S.mP.file)+" · "+S.mP.n.toLocaleString("vi-VN")+" dòng":"Chưa có. Bấm chọn hoặc kéo thả."}</div></label>${st("palet")}</div>
  <div><label class="drop ic ic4" id="drop2"><input type="file" id="f2" accept=".xlsx,.xls" hidden><b>4. Bảng Dãy kệ · tên khu (không bắt buộc)</b><div class="muted">${z?`Đang có ${z} khu/dãy.`:"Chưa có. Dùng để hiện tên khu."}</div></label>${I.zmsg?`<div class="note ${I.zok?"ok":""}">${esc(I.zmsg)}</div>`:""}</div>
  <div><label class="drop ic ic5" id="drop5"><input type="file" id="f5" accept=".xlsx,.xls,.csv" hidden><b>5. Tồn kho (.xlsx / .csv)</b><div class="muted">${S.mT?esc(S.mT.file)+" · "+S.mT.n.toLocaleString("vi-VN")+" mã":"Chưa có. Bấm chọn hoặc kéo thả."}</div></label>${st("ton")}</div>
  <div><label class="drop ic ic6" id="drop6"><input type="file" id="f6" accept=".xlsx,.xls" hidden><b>6. Vòng quay · Tổng hợp SL soạn (.xlsx)</b><div class="muted">${S.mV?esc(S.mV.file)+" · "+S.mV.n.toLocaleString("vi-VN")+" mã · "+S.mV.days+" ngày":"Chưa có. Cập nhật khoảng 1 tháng 1 lần."}</div></label>${st("vq")}</div>
  </div>
  ${I.busy?`<div class="panel" style="padding:12px 16px;margin-top:10px"><b>${esc(I.busy)}</b><div class="prog"><i style="width:${I.pct||0}%"></i></div></div>`:""}
  ${I.err?`<div class="note" style="background:var(--bad-soft);color:var(--bad)">${esc(I.err)}</div>`:""}

  <p style="margin-top:18px"><button class="btn sec" id="clearall" style="color:var(--bad)">Xóa toàn bộ dữ liệu đã nhập</button></p>
  <p class="muted" style="font-size:13px;margin-top:16px">Dữ liệu lưu trên máy này. Sau khi nhập xong, bấm “Xuất file cho nhân viên” ở tab Dashboard.</p>`;
  return h;
}

/* ---- import: parse CSV ---- */
const COLS={so:"so phieu soan hang",loai:"loai soan",ngay:"ngay day phieu soan",tt:"ngay soan thuc te",sp:"ma sp",tsp:"ten sp",kho:"ma kho xuat",shop:"ma shop nhan",tshop:"ten shop nhan",yc:"sl yeu cau soan",da:"sl da soan",dvt:"dvt",loc:"ma vi tri",nhom:"nhom shop",nv:"nhan vien duoc phan cong soan",tnv:"ten nhan vien duoc phan cong soan"};
const NEED=["so","sp","tsp","yc","da","loc","shop"];
function normNhom(t){t=String(t||"").trim().replace(/\s+/g," "); if(!t) return "(trống)"; if(norm(t).startsWith("nhom")) return "Nhóm "+t.slice(4).trim(); return t;}
function parseCSV(file,onProg){
  return new Promise((res,rej)=>{
    let idx=null,rows=0; const A={sp:new Map(),shop:new Map(),nhom:new Map(),nv:new Map(),kho:new Map(),loai:new Map(),ph:new Map()};
    const D=emptyD(); const put=(m,arr,key,val)=>{let i=m.get(key); if(i===undefined){i=arr.length;m.set(key,i);arr.push(val);} return i;};
    Papa.parse(file,{skipEmptyLines:true,chunkSize:1<<21,
      chunk:(r,parser)=>{
        try{ let data=r.data; if(!idx){ const hd=data[0].map(h=>norm(String(h).replace(/^﻿/,""))); idx={}; for(const k in COLS){idx[k]=hd.indexOf(COLS[k]);}
            const miss=NEED.filter(k=>idx[k]<0); if(miss.length){parser.abort(); return rej(new Error("File thiếu cột: "+miss.map(k=>COLS[k]).join(", ")+". Đây có đúng file Báo cáo soạn hàng WMS không?"));} data=data.slice(1); }
          for(const c of data){ if(c.length<8) continue; rows++;
            const so=strip(c[idx.so]); if(!so) continue;
            const spI=put(A.sp,D.sp,strip(c[idx.sp]),[strip(c[idx.sp]),String(c[idx.tsp]).trim(),String(c[idx.dvt]??"").trim()]);
            let p=A.ph.get(so);
            if(!p){ const nvC=idx.nv>=0?strip(c[idx.nv]):"";
              p=[so,put(A.loai,D.loai,String(c[idx.loai]||"").trim(),String(c[idx.loai]||"").trim()),String(c[idx.ngay]||"").trim(),
                 put(A.shop,D.shop,strip(c[idx.shop]),[strip(c[idx.shop]),String(c[idx.tshop]||"").trim()]),
                 put(A.nhom,D.nhom,normNhom(c[idx.nhom]).toLowerCase(),normNhom(c[idx.nhom])),
                 nvC?put(A.nv,D.nv,nvC,[nvC,String(c[idx.tnv]||"").trim()]):-1,[]];
              A.ph.set(so,p); }
            const khoC=strip(c[idx.kho]); const loc=strip(c[idx.loc]); let suf=""; const pos=loc.indexOf("_Z9_"); if(pos>=0) suf=loc.slice(pos+4); else if(loc) suf=loc;
            const row=[spI,put(A.kho,D.kho,khoC,[khoC]),suf,parseFloat(c[idx.yc])||0,parseFloat(c[idx.da])||0]; const tt=String(c[idx.tt]||"").trim(); if(tt) row.push(tt.slice(5));
            p[6].push(row); }
          onProg(rows,r.meta.cursor);
        }catch(e){parser.abort();rej(e);} },
      complete:()=>{ if(!idx) return rej(new Error("File rỗng hoặc sai định dạng.")); D.phieu=[...A.ph.values()].sort((a,b)=>a[0]<b[0]?-1:1).map(p=>({so:p[0],loai:p[1],ngay:p[2],shop:p[3],nhom:p[4],nv:p[5],rows:p[6]})); res({D:derive(D),rows}); },
      error:e=>rej(e)});
  });
}
const enc=new TextEncoder(); const bytes=o=>enc.encode(JSON.stringify(o)).length;
function pack(D){
  const docs=[]; const LIM=190000;
  docs.push(["dict",{shop:D.shop,nhom:D.nhom,nv:D.nv,kho:D.kho,loai:D.loai}]);
  let cur=[],sz=0,n=0; for(const s of D.sp){ const b=bytes(s)+1; if(sz+b>LIM){docs.push(["sp"+String(n++).padStart(3,"0"),{s:cur}]);cur=[];sz=0;} cur.push(s);sz+=b; } if(cur.length) docs.push(["sp"+String(n++).padStart(3,"0"),{s:cur}]);
  cur=[];sz=0;n=0; for(const p of D.phieu){ const it=[p.so,p.loai,p.ngay,p.shop,p.nhom,p.nv,p.rows]; const b=bytes(it)+1; if(sz+b>LIM&&cur.length){docs.push(["c"+String(n++).padStart(4,"0"),{p:cur}]);cur=[];sz=0;} cur.push(it);sz+=b; } if(cur.length) docs.push(["c"+String(n++).padStart(4,"0"),{p:cur}]);
  return docs;
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("wms-local",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function idbPut(v){const d=await idb();await new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,"state");t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function persist(){ await idbPut({docs:S.D?pack(S.D):[],zones:[...S.zones.values()],meta:S.meta,rack:S.rack,palet:S.palet,ton:S.ton,vq:S.vq,mR:S.mR,mP:S.mP,mT:S.mT,mV:S.mV}); }
async function upload(){
  const I=S.imp, D=I.parsed; I.busy="Đang lưu dữ liệu…"; I.pct=100; render();
  try{
    S.meta={file:I.file,at:Date.now(),phieu:D.phieu.length,rows:I.rows}; S.D=D; S._dayOpts=null; S._dash=null; buildProds();
    await persist();
    S.tab="dash"; S.imp={}; S.msg=`Đã nhập ${D.phieu.length.toLocaleString("vi-VN")} phiếu (${I.rows.toLocaleString("vi-VN")} dòng). Bấm “Xuất file cho nhân viên” để tạo app tra cứu gửi cho nhân viên.`;
  }catch(e){ I.busy=null; I.err="Không lưu được: "+(e&&e.message||e); }
  render();
}
async function b64gz(obj){
  const buf=await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
  const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(s);
}
async function unb64gz(b){
  const bin=atob(b), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); return JSON.parse(txt);
}
async function exportStaff(){
  if(!S.D&&!S.rack.length&&!S.palet.length&&!S.ton.length) return; const btn=document.querySelector("[data-export]"); if(btn){btn.disabled=true;btn.textContent="Đang tạo file…";}
  try{
    const b=await b64gz({docs:S.D?pack(S.D):[],zones:[...S.zones.values()],meta:S.meta,rack:S.rack,palet:S.palet,ton:S.ton,vq:S.vq,mR:S.mR,mP:S.mP,mT:S.mT,mV:S.mV});
    let src=SRC.replace(/<script src="https:\/\/cdnjs[^>]*><\/script>\s*/g,"").replace(/<title>[^<]*<\/title>/,"<title>Tra Cứu Soạn Hàng</title>");
    const tag='<script id="embedded"><'+'/script>';
    if(!src.includes(tag)) throw new Error("Không tạo được file (thiếu khung nhúng).");
    src=src.replace(tag,()=>'<script id="embedded">window.__STAFF=true;window.__DATA="'+b+'";<'+'/script>');
    const d=new Date((S.meta&&S.meta.at)||Date.now()), ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([src],{type:"text/html"})); a.download="index.html"; document.body.appendChild(a); a.click(); a.remove();
    S.msg="Đã tạo file index.html trong thư mục Tải xuống. Tải file này lên GitHub (thay file index.html cũ) để nhân viên thấy dữ liệu mới.";
  }catch(e){ S.msg="Không xuất được file: "+(e&&e.message||e); }
  render();
}

async function handleCSV(file){
  const I=S.imp={file:file.name,busy:"Đang đọc file…",pct:0}; S.msg=""; render();
  try{ let last=0; const r=await parseCSV(file,(rows,cur)=>{ I.pct=Math.min(99,cur/file.size*100); if(Date.now()-last>250){last=Date.now(); I.busy=`Đang đọc file… ${rows.toLocaleString("vi-VN")} dòng`; render();} });
    I.parsed=r.D; I.rows=r.rows; I.plan=pack(r.D).length; I.busy=null; }
  catch(e){ I.busy=null; I.err=e&&e.message||String(e); }
  render();
}
async function handleZones(file){
  const I=S.imp; I.zmsg="Đang đọc…"; I.zok=false; render();
  try{ const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    const list=[]; for(const r of rows.slice(1)){ const k=String(r[0]||"").trim(); if(/^\d+_Z\d+_R\d+/.test(k)) list.push([k,String(r[1]||"").trim(),String(r[2]||"").trim()]); }
    if(!list.length) throw new Error("Không thấy dòng nào có dạng 80002010_Z9_R2_D1 ở cột A.");
    S.zones=new Map(list.map(z=>[z[0],z])); S._dayOpts=null; S._dash=null; await persist();
    I.zmsg=`Đã lưu ${list.length} khu/dãy kệ.`; I.zok=true;
  }catch(e){ I.zmsg="Lỗi: "+(e&&e.message||e); I.zok=false; }
  render();
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-tab],[data-pick],[data-pickv],#clearall,[data-sp],[data-ph],[data-back],[data-reload],[data-sort],[data-toggle],#go,#cancel"); if(!el) return;
  if(el.dataset.sort){const [id,k]=el.dataset.sort.split(":"); const c=S.sort[id]||{k:"rest",d:"desc"}; S.sort[id]={k,d:c.k===k?(c.d==="asc"?"desc":"asc"):(k==="name"?"asc":"desc")}; return render();}
  if(el.dataset.toggle==="hourtable"){S.hourTable=!S.hourTable;return render();}
  if(el.dataset.pick!==undefined){S.pick=+el.dataset.pick; const o=S.prods[S.pick]; S.q.sp=o.code+" - "+(o.name||""); const q=$("#q"); if(q) q.value=S.q.sp; lookupResults(); window.scrollTo(0,0); return;}
  if(el.dataset.pickv!==undefined){S.pickV=+el.dataset.pickv; const o=S.vq.rows[S.pickV]; S.q.vq=o[0]+" - "+o[1]; const q=$("#q"); if(q) q.value=S.q.vq; vqResults(); window.scrollTo(0,0); return;}
  if(el.dataset.tab){S.tab=el.dataset.tab;S.view=null;S.hist=[];S.msg="";return render();}
  if(el.dataset.sp!==undefined){S.hist.push({tab:S.tab,view:S.view});S.tab="sp";S.view={t:"sp",id:+el.dataset.sp};return render();}
  if(el.dataset.ph){S.hist.push({tab:S.tab,view:S.view});S.tab="phieu";S.view={t:"ph",id:el.dataset.ph};return render();}
  if("back" in el.dataset){const h=S.hist.pop()||{tab:S.tab,view:null};S.tab=h.tab;S.view=h.view;return render();}
  
  if(el.id==="go") return upload();
  if(el.id==="cancel"){S.imp={};return render();}
  if(el.id==="clearall"){ if(!confirm("Xóa toàn bộ dữ liệu đã nhập (báo cáo, dãy kệ, palet, tồn kho, vòng quay)? Không thể hoàn tác.")) return;
    S.D=null;S.meta=null;S.zones=new Map();S.rack=[];S.palet=[];S.ton=[];S._tonMap=null;S.vq=null;S.mR=S.mP=S.mT=S.mV=null;S.imp={};S.pick=null;S.pickV=null;S.q={sp:"",phieu:"",vq:""};S.view=null;
    buildProds(); persist().then(()=>{S.tab="import";S.msg="Đã xóa toàn bộ dữ liệu. Hãy nhập lại các file.";render();}); return; }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ const t=S.tab; S.q[t]=e.target.value; if(t==="sp") S.pick=null; if(t==="vq") S.pickV=null; clearTimeout(S._qt); S._qt=setTimeout(()=>t==="sp"?lookupResults():t==="vq"?vqResults():phResults(),120);} });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="q"&&S.tab==="vq"&&S.pickV==null&&S.suggV&&S.suggV.length){ S.pickV=S.suggV[0]; const o=S.vq.rows[S.pickV]; S.q.vq=o[0]+" - "+o[1]; e.target.value=S.q.vq; e.target.blur(); vqResults(); return; }
  if(e.key==="Enter"&&e.target.id==="q"&&S.tab==="sp"&&S.pick==null&&S.sugg&&S.sugg.length){ S.pick=S.sugg[0]; const o=S.prods[S.pick]; S.q.sp=o.code+" - "+(o.name||""); e.target.value=S.q.sp; e.target.blur(); lookupResults(); } });
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="f1"&&el.files[0]) handleCSV(el.files[0]);
  if(el.id==="f2"&&el.files[0]) handleZones(el.files[0]);
  if(el.id==="f3"&&el.files[0]) handleTable("rack",el.files[0]);
  if(el.id==="f4"&&el.files[0]) handleTable("palet",el.files[0]);
  if(el.id==="f5"&&el.files[0]) handleTon(el.files[0]);
  if(el.id==="f6"&&el.files[0]) handleVQ(el.files[0]);
  if(el.id==="day"){S.dayKey=el.value;render();}
  if(el.id==="onlyopen"){S.onlyOpen=el.checked;render();}
});
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]"),tip=$("#tip"); if(!t){tip.hidden=true;return;} tip.textContent=t.dataset.tip; tip.hidden=false; const w=tip.offsetWidth; tip.style.left=Math.max(8,Math.min(innerWidth-w-8,e.clientX+12))+"px"; tip.style.top=(e.clientY+16)+"px";});
for(const t of ["dragover","dragleave","drop"]) document.addEventListener(t,e=>{ const d=e.target.closest&&e.target.closest(".drop"); if(!d) return; e.preventDefault(); d.classList.toggle("on",t==="dragover"); if(t==="drop"){const f=e.dataTransfer.files[0]; if(f) ({drop1:handleCSV,drop2:handleZones,drop3:x=>handleTable("rack",x),drop4:x=>handleTable("palet",x),drop5:handleTon,drop6:handleVQ})[d.id](f);} });

document.addEventListener("click",e=>{ if(e.target.closest("[data-export]")) exportStaff(); },true);
async function boot(){
  render();
  try{
    let st=null;
    if(window.__DATA){ S.staff=true; S.canEdit=false; st=await unb64gz(window.__DATA); window.__DATA=null; }
    else { S.canEdit=true; S.tab="dash"; st=await idbGet(); }
    if(st){ S.D=(st.docs&&st.docs.length)?assemble(st.docs):null; S.meta=st.meta||null; S.zones=new Map((st.zones||[]).map(z=>[z[0],z])); S.rack=st.rack||[]; S.palet=st.palet||[]; S.ton=st.ton||[]; S.mR=st.mR||null; S.mP=st.mP||null; S.mT=st.mT||null; S.vq=st.vq||null; S.mV=st.mV||null; }
    buildProds();
    S.loaded=true; render();
  }catch(e){ S.err="Không mở được dữ liệu: "+(e&&e.message||e); S.loaded=true; render(); }
}
boot();
})();
